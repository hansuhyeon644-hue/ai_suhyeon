<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나에게 맞는 직무 유형 테스트</title>
    <meta
      name="description"
      content="12개의 대학생활 질문으로 알아보는 나만의 일하는 스타일과 어울리는 직무 유형 테스트"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      :root {
        --bg-canvas: #fff7f7;
        --bg-surface: #ffffff;
        --bg-soft: #fff0f0;
        --border-soft: #f5d4d4;
        --divider-soft: #f7e2e2;
        --accent: #d94141;
        --accent-hover: #c43232;
        --accent-text: #b82d2d;
        --ink: #241919;
        --ink-muted: #665252;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        font-family: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background-color: var(--bg-canvas);
        color: var(--ink);
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font-family: inherit;
        border: none;
        background: none;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .app-shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        transition: background-color 280ms ease;
      }

      /* 상단 바 */
      .top-header {
        position: sticky;
        top: 0;
        z-index: 20;
        height: 56px;
        border-bottom: 1px solid var(--border-soft);
        background-color: rgba(255, 247, 247, 0.94);
        backdrop-filter: blur(8px);
        transition: background-color 280ms ease, border-color 280ms ease;
      }

      .header-inner {
        max-width: 1024px;
        height: 100%;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .header-inner.narrow {
        max-width: 768px;
      }

      .brand-btn {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink);
        white-space: nowrap;
        padding: 8px 0;
      }

      .header-action-btn {
        font-size: 14px;
        font-weight: 600;
        color: var(--accent-text);
        min-height: 44px;
        padding: 0 8px;
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
        transition: color 150ms ease;
      }

      .header-action-btn:hover {
        color: var(--accent);
      }

      /* 메인 컨테이너 */
      .main-stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }

      @media (min-width: 640px) {
        .main-stage {
          padding: 40px 24px;
        }
      }

      /* 시작 화면 카드 */
      .start-card {
        width: 100%;
        max-width: 1024px;
        background: var(--bg-surface);
        border: 1px solid var(--border-soft);
        border-radius: 24px;
        padding: 24px;
      }

      @media (min-width: 640px) {
        .start-card {
          padding: 40px;
        }
      }

      @media (min-width: 1024px) {
        .start-card {
          padding: 48px;
        }
      }

      .start-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 32px;
        align-items: stretch;
      }

      @media (min-width: 1024px) {
        .start-grid {
          grid-template-columns: 1fr 1fr;
          gap: 48px;
        }
      }

      .start-content {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 24px;
      }

      .kicker {
        font-size: 13px;
        font-weight: 700;
        color: var(--accent-text);
        margin: 0 0 12px 0;
      }

      .hero-title {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.025em;
        color: var(--ink);
      }

      @media (min-width: 640px) {
        .hero-title {
          font-size: 40px;
        }
      }

      .hero-desc {
        margin: 16px 0 0 0;
        font-size: 15px;
        line-height: 1.65;
        color: var(--ink-muted);
      }

      .role-preview {
        border-top: 1px solid var(--divider-soft);
        padding-top: 16px;
      }

      .role-preview-label {
        margin: 0 0 8px 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-muted);
      }

      .role-preview-list {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
      }

      .dot-sep {
        color: #e2a8a8;
      }

      .primary-btn {
        width: 100%;
        min-height: 52px;
        padding: 14px 30px;
        border-radius: 16px;
        background-color: var(--accent);
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
        transition: background-color 150ms ease, transform 120ms ease;
      }

      @media (min-width: 640px) {
        .primary-btn.auto-width {
          width: auto;
        }
      }

      .primary-btn:hover {
        background-color: var(--accent-hover);
      }

      .primary-btn:active {
        transform: scale(0.98);
      }

      .illustration-box {
        width: 100%;
        border-radius: 18px;
        background-color: #fff5f5;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 4 / 3;
      }

      .illustration-box.square {
        max-width: 260px;
        margin: 0 auto;
        aspect-ratio: 1 / 1;
      }

      @media (min-width: 1024px) {
        .start-grid .illustration-box {
          aspect-ratio: auto;
          height: 100%;
        }
      }

      .illustration-box svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* 질문 화면 */
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 44px;
        padding-right: 12px;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-muted);
        white-space: nowrap;
      }

      .back-btn:hover {
        color: var(--ink);
      }

      .progress-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        max-width: 260px;
      }

      .progress-track {
        flex: 1;
        height: 8px;
        border-radius: 999px;
        background-color: #fde2e2;
        overflow: hidden;
      }

      .progress-fill {
        width: 100%;
        height: 100%;
        background-color: var(--accent);
        border-radius: 999px;
        transform-origin: left center;
        transition: transform 280ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .progress-text {
        font-size: 14px;
        font-weight: 700;
        color: var(--accent-text);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .quiz-container {
        width: 100%;
        max-width: 768px;
        animation: fade-slide-in 200ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes fade-slide-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .question-meta {
        font-size: 13px;
        font-weight: 700;
        color: var(--accent-text);
        margin: 0 0 8px 0;
      }

      .question-title {
        margin: 0 0 28px 0;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.4;
        color: var(--ink);
      }

      @media (min-width: 640px) {
        .question-title {
          font-size: 26px;
        }
      }

      .options-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      @media (min-width: 768px) {
        .options-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .option-card {
        text-align: left;
        background: var(--bg-surface);
        border: 1px solid var(--border-soft);
        border-radius: 24px;
        padding: 24px;
        min-height: 128px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 16px;
        transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease, opacity 150ms ease;
      }

      @media (min-width: 640px) {
        .option-card {
          padding: 28px;
          min-height: 168px;
        }
      }

      .option-card:hover:not(:disabled) {
        border-color: #e37d7d;
        transform: translateY(-2px);
      }

      .option-card:active:not(:disabled) {
        transform: scale(0.985);
      }

      .option-card.selected {
        background-color: #fff0f0;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(217, 65, 65, 0.16);
        animation: choice-pop 280ms cubic-bezier(0.22, 1.4, 0.36, 1) forwards;
      }

      .option-card.dimmed {
        opacity: 0.55;
      }

      @keyframes choice-pop {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.032) translateY(-3px);
        }
        70% {
          transform: scale(0.985) translateY(0);
        }
        100% {
          transform: scale(1.01) translateY(-1px);
        }
      }

      .option-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .option-badge {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background-color: var(--bg-soft);
        color: var(--accent-text);
        font-size: 14px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .option-card.selected .option-badge {
        background-color: var(--accent);
        color: #ffffff;
      }

      .option-check {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background-color: var(--accent);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .option-label {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.6;
        color: var(--ink);
      }

      @media (min-width: 640px) {
        .option-label {
          font-size: 16px;
        }
      }

      /* 결과 화면 */
      .result-grid {
        width: 100%;
        max-width: 1024px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: stretch;
        animation: fade-slide-in 240ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      @media (min-width: 1024px) {
        .result-grid {
          grid-template-columns: 5fr 7fr;
        }
      }

      .result-hero-card,
      .result-detail-card {
        border-radius: 24px;
        border: 1px solid var(--role-border, var(--border-soft));
        padding: 28px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 24px;
      }

      @media (min-width: 640px) {
        .result-hero-card,
        .result-detail-card {
          padding: 36px;
        }
      }

      .result-hero-card {
        background-color: var(--role-hero-bg, #ffe8e8);
      }

      .result-detail-card {
        background-color: #ffffff;
      }

      .result-kicker {
        margin: 0 0 8px 0;
        font-size: 14px;
        font-weight: 700;
        color: var(--role-accent-text, var(--accent-text));
      }

      .result-title {
        margin: 0;
        font-size: 32px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.03em;
        color: #1e1919;
      }

      @media (min-width: 640px) {
        .result-title {
          font-size: 40px;
        }
      }

      .result-nickname {
        margin: 10px 0 0 0;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.4;
        color: var(--role-accent-text, var(--accent-text));
      }

      .result-desc {
        margin: 0;
        font-size: 15px;
        line-height: 1.7;
        color: #382f2f;
      }

      .section-heading {
        margin: 0 0 4px 0;
        font-size: 19px;
        font-weight: 800;
        color: #1e1919;
      }

      .section-sub {
        margin: 0 0 18px 0;
        font-size: 14px;
        color: #5e5252;
      }

      .prep-list {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--role-divider, var(--divider-soft));
        border-bottom: 1px solid var(--role-divider, var(--divider-soft));
      }

      .prep-item {
        padding: 16px 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .prep-item + .prep-item {
        border-top: 1px solid var(--role-divider, var(--divider-soft));
      }

      .prep-meta {
        font-size: 12px;
        font-weight: 700;
        color: var(--role-accent-text, var(--accent-text));
        font-variant-numeric: tabular-nums;
      }

      .prep-title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: #1e1919;
      }

      .prep-detail {
        margin: 0;
        font-size: 14px;
        line-height: 1.55;
        color: #5e5252;
      }

      .chart-title {
        margin: 0 0 12px 0;
        font-size: 14px;
        font-weight: 700;
        color: #1e1919;
      }

      .chart-rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .chart-row {
        display: grid;
        grid-template-columns: 56px 1fr 36px;
        align-items: center;
        gap: 12px;
      }

      .chart-label {
        font-size: 14px;
        font-weight: 500;
        color: #5e5252;
      }

      .chart-label.winner {
        font-weight: 700;
        color: #1e1919;
      }

      .chart-track {
        height: 10px;
        border-radius: 999px;
        background-color: var(--role-bar-track, #fff0f0);
        overflow: hidden;
      }

      .chart-fill {
        width: 100%;
        height: 100%;
        border-radius: 999px;
        transform-origin: left center;
        background-color: var(--role-bar-muted, #f1baba);
      }

      .chart-fill.winner {
        background-color: var(--role-accent, #cf3838);
      }

      .chart-score {
        font-size: 12px;
        font-weight: 500;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: #5e5252;
      }

      .chart-score.winner {
        font-weight: 700;
        color: var(--role-accent-text, var(--accent-text));
      }

      .action-row {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      @media (min-width: 640px) {
        .action-row {
          flex-direction: row;
        }
      }

      .share-btn {
        flex: 1;
        min-height: 52px;
        padding: 14px 24px;
        border-radius: 16px;
        background-color: var(--role-soft-btn, #ffeaea);
        color: var(--role-accent-text, #a82626);
        font-size: 16px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
        transition: background-color 150ms ease, transform 120ms ease;
      }

      .share-btn:hover {
        background-color: var(--role-soft-btn-hover, #ffd8d8);
      }

      .share-btn:active {
        transform: scale(0.98);
      }

      .result-primary-btn {
        flex: 1;
        background-color: var(--role-accent, #cf3838);
      }

      .result-primary-btn:hover {
        background-color: var(--role-accent-hover, #b82c2c);
      }

      .copy-feedback {
        margin: 8px 0 0 0;
        min-height: 18px;
        font-size: 12px;
        text-align: center;
        color: #5e5252;
      }

      @media (prefers-reduced-motion: reduce) {
        .option-card.selected,
        .quiz-container,
        .result-grid {
          animation: none;
        }
        .progress-fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-shell"></div>

    <script>
      const ROLE_ORDER = ['pm', 'dev', 'design', 'data'];

      const ROLE_SHORT_LABELS = {
        pm: '기획',
        dev: '개발',
        design: '디자인',
        data: '데이터',
      };

      const QUIZ_QUESTIONS = [
        {
          id: 1,
          context: '조별과제',
          question: '조별과제 첫 회의, 다들 어색해서 방향이 안 잡힐 때 나는?',
          options: [
            {
              id: 'A',
              label: '전체 일정표와 역할 분담 초안을 먼저 짜서 “이렇게 해볼까요?” 제안한다',
              role: 'pm',
            },
            {
              id: 'B',
              label: '우리가 실제로 만들어야 할 결과물의 구현 방식과 기능 구조부터 따져본다',
              role: 'dev',
            },
          ],
        },
        {
          id: 2,
          context: '동아리',
          question: '동아리 신입 부원 모집 홍보를 맡게 됐다. 가장 먼저 신경 쓰는 것은?',
          options: [
            {
              id: 'A',
              label: '피드에서 시선을 확 끄는 포스터 색감과 읽기 편한 카드뉴스 배치',
              role: 'design',
            },
            {
              id: 'B',
              label: '작년 지원율이 높았던 요일·홍보 채널과 학과별 유입 패턴 분석',
              role: 'data',
            },
          ],
        },
        {
          id: 3,
          context: '아르바이트',
          question: '카페·매장 아르바이트 중 피크타임마다 주문이 밀린다면 내가 떠올리는 해결책은?',
          options: [
            {
              id: 'A',
              label: '시간대별 인기 메뉴 비중을 세어두고 미리 준비할 재료를 계산해둔다',
              role: 'data',
            },
            {
              id: 'B',
              label: '주문·제조·픽업 동선이 겹치지 않도록 팀원 역할을 다시 배치해본다',
              role: 'pm',
            },
          ],
        },
        {
          id: 4,
          context: '조별과제',
          question: '팀플 발표나 웹 결과물을 최종 제출하기 직전, 더 끝까지 붙잡는 부분은?',
          options: [
            {
              id: 'A',
              label: '처음 보는 사람도 한눈에 이해하고 완성도 있다고 느낄 화면 흐름과 여백',
              role: 'design',
            },
            {
              id: 'B',
              label: '시연 중에 버튼이 안 눌리거나 오류가 나지 않도록 기능 동작 꼼꼼히 점검',
              role: 'dev',
            },
          ],
        },
        {
          id: 5,
          context: '동아리',
          question: '동아리 축제 부스를 준비하게 됐을 때, 내가 가장 재미있게 할 수 있는 일은?',
          options: [
            {
              id: 'A',
              label: '부스 현수막과 굿즈, 안내 포스터까지 우리 팀만의 분위기로 예쁘게 꾸미기',
              role: 'design',
            },
            {
              id: 'B',
              label: '사람들이 발길을 멈추고 참여할 수 있게 부스 콘셉트와 운영 순서 짜기',
              role: 'pm',
            },
          ],
        },
        {
          id: 6,
          context: '아르바이트',
          question: '매장에서 매일 반복되는 재고 체크·마감 정산이 번거롭게 느껴질 때 나는?',
          options: [
            {
              id: 'A',
              label: '일주일치 판매량과 폐기 수치를 모아 어디서 손실이 나는지 원인부터 찾는다',
              role: 'data',
            },
            {

            <polyline points="66,120 98,104 130,86 164,68" stroke="#2B2121" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="152" cy="128" r="42" fill="#DCF3EA" fill-opacity="0.65" stroke="#2B2121" stroke-width="3"/>
            <line x1="182" y1="158" x2="216" y2="194" stroke="#2B2121" stroke-width="7" stroke-linecap="round"/>
          </svg>`;
      }

      const state = {
        phase: 'start',
        currentIndex: 0,
        answers: {},
        selectedOptionId: null,
        copied: false,
        timerId: null,
      };

      function clearPendingTimer() {
        if (state.timerId !== null) {
          clearTimeout(state.timerId);
          state.timerId = null;
        }
      }

      function evaluateAnswers() {
        const scores = { pm: 0, dev: 0, design: 0, data: 0 };
        for (const q of QUIZ_QUESTIONS) {
          const picked = state.answers[q.id];
          if (picked) {
            scores[picked.role] += 1;
          }
        }

        const maxScore = Math.max(...ROLE_ORDER.map((r) => scores[r]));
        const tied = ROLE_ORDER.filter((r) => scores[r] === maxScore);

        if (tied.length === 1) {
          return { topRole: tied[0], scores };
        }

        let winner = tied[0];
        for (let i = 1; i < tied.length; i += 1) {
          const challenger = tied[i];
          let winnerWins = 0;
          let challengerWins = 0;
          let lastWinner = null;

          for (const q of QUIZ_QUESTIONS) {
            const pair = [q.options[0].role, q.options[1].role];
            if (pair.includes(winner) && pair.includes(challenger)) {
              const pickedRole = state.answers[q.id]?.role;
              if (pickedRole === winner) {
                winnerWins += 1;
                lastWinner = winner;
              } else if (pickedRole === challenger) {
                challengerWins += 1;
                lastWinner = challenger;
              }
            }
          }

          if (challengerWins > winnerWins || (challengerWins === winnerWins && lastWinner === challenger)) {
            winner = challenger;
          }
        }

        return { topRole: winner, scores };
      }

      async function copyTextToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (err) {
            // 아래 fallback으로 진행
          }
        }
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(textarea);
          return ok;
        } catch (err) {
          return false;
        }
      }

      function startQuiz() {
        clearPendingTimer();
        state.phase = 'quiz';
        state.currentIndex = 0;
        state.answers = {};
        state.selectedOptionId = null;
        state.copied = false;
        render();
      }

      function resetToStart() {
        clearPendingTimer();
        state.phase = 'start';
        state.currentIndex = 0;
        state.answers = {};
        state.selectedOptionId = null;
        state.copied = false;
        render();
      }

      function handleSelectOption(optionId) {
        if (state.selectedOptionId !== null) return;
        const currentQ = QUIZ_QUESTIONS[state.currentIndex];
        const option = currentQ.options.find((o) => o.id === optionId);
        if (!option) return;

        state.selectedOptionId = optionId;
        state.answers[currentQ.id] = option;
        render();

        clearPendingTimer();
        state.timerId = setTimeout(() => {
          state.selectedOptionId = null;
          if (state.currentIndex + 1 < QUIZ_QUESTIONS.length) {
            state.currentIndex += 1;
          } else {
            state.phase = 'result';
          }
          render();
        }, 280);
      }

      function handleBack() {
        clearPendingTimer();
        state.selectedOptionId = null;
        if (state.currentIndex > 0) {
          state.currentIndex -= 1;
        } else {
          state.phase = 'start';
        }
        render();
      }

      async function handleShare() {
        const evaluation = evaluateAnswers();
        const profile = ROLE_RESULTS[evaluation.topRole];
        const prepLines = profile.prepItems
          .map((item, idx) => `${idx + 1}. [${item.category}] ${item.title}`)
          .join('\n');
        const scoreLines = ROLE_ORDER.map(
          (role) => `${ROLE_SHORT_LABELS[role]} ${evaluation.scores[role]}/6`
        ).join(' · ');

        const shareText = [
          '[나에게 맞는 직무 유형 테스트 결과]',
          `나의 추천 직무: ${profile.title}`,
          `"${profile.nickname}"`,
          '',
          profile.description,
          '',
          '추천 자격증·과목:',
          prepLines,
          '',
          `일하는 스타일 분포: ${scoreLines}`,
        ].join('\n');

        const ok = await copyTextToClipboard(shareText);
        if (ok) {
          state.copied = true;
          render();
          setTimeout(() => {
            state.copied = false;
            if (state.phase === 'result') render();
          }, 2400);
        }
      }

      function render() {
        const root = document.getElementById('app');

        if (state.phase === 'start') {
          root.style.backgroundColor = '#fff7f7';
          root.innerHTML = `
            <header class="top-header">
              <div class="header-inner">
                <button type="button" class="brand-btn" id="brand-btn">나에게 맞는 직무 유형 테스트</button>
                <button type="button" class="header-action-btn" id="header-start-btn">테스트 시작</button>
              </div>
            </header>
            <main class="main-stage">
              <section class="start-card">
                <div class="start-grid">
                  <div class="start-content">
                    <div>
                      <p class="kicker">대학생 2~4학년 진로 탐색 · 12문항 · 약 2분</p>
                      <h1 class="hero-title">나에게 맞는<br />직무 유형 테스트</h1>
                      <p class="hero-desc">
                        조별과제, 동아리, 아르바이트처럼 익숙한 대학생활 상황 12가지를 통해
                        내가 일할 때 가장 편안하고 빛나는 방식을 알아보세요.
                      </p>
                    </div>
                    <div class="role-preview">
                      <p class="role-preview-label">측정하는 4가지 대표 직무 스타일</p>
                      <div class="role-preview-list">
                        <span>기획형 PM</span><span class="dot-sep" aria-hidden="true">·</span>
                        <span>구현형 개발자</span><span class="dot-sep" aria-hidden="true">·</span>
                        <span>공감형 디자이너</span><span class="dot-sep" aria-hidden="true">·</span>
                        <span>탐구형 데이터 애널리스트</span>
                      </div>
                    </div>
                    <div>
                      <button type="button" class="primary-btn auto-width" id="start-btn">
                        <span>시작하기</span>
                        <span aria-hidden="true">→</span>
                      </button>
                    </div>
                  </div>
                  <div class="illustration-box">
                    ${getSvgIllustration('hero')}
                  </div>
                </div>
              </section>
            </main>
          `;

          document.getElementById('brand-btn').addEventListener('click', resetToStart);
          document.getElementById('header-start-btn').addEventListener('click', startQuiz);
          document.getElementById('start-btn').addEventListener('click', startQuiz);
          return;
        }

        if (state.phase === 'quiz') {
          root.style.backgroundColor = '#fff7f7';
          const q = QUIZ_QUESTIONS[state.currentIndex];
          const progress = (state.currentIndex + 1) / QUIZ_QUESTIONS.length;

          root.innerHTML = `
            <header class="top-header">
              <div class="header-inner narrow">
                <button type="button" class="back-btn" id="back-btn">
                  <span aria-hidden="true">←</span>
                  <span>${state.currentIndex === 0 ? '처음으로' : '이전 질문'}</span>
                </button>
                <div class="progress-wrap">
                  <div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="12" aria-valuenow="${state.currentIndex + 1}">
                    <div class="progress-fill" style="transform: scaleX(${progress})"></div>
                  </div>
                  <span class="progress-text">${state.currentIndex + 1}/${QUIZ_QUESTIONS.length}</span>
                </div>
              </div>
            </header>
            <main class="main-stage">
              <div class="quiz-container">
                <p class="question-meta">Q${q.id} · ${q.context}</p>
                <h1 class="question-title">${q.question}</h1>
                <div class="options-grid">
                  ${q.options
                    .map((opt) => {
                      const isSelected = state.selectedOptionId === opt.id;
                      const isDimmed = state.selectedOptionId !== null && !isSelected;
                      const stateClass = isSelected ? 'selected' : isDimmed ? 'dimmed' : '';
                      return `
                        <button
                          type="button"
                          class="option-card ${stateClass}"
                          data-option="${opt.id}"
                          ${state.selectedOptionId !== null ? 'disabled' : ''}
                          aria-pressed="${isSelected}"
                        >
                          <div class="option-top">
                            <span class="option-badge">${opt.id}</span>
                            ${isSelected ? '<span class="option-check" aria-hidden="true">✓</span>' : ''}
                          </div>
                          <p class="option-label">${opt.label}</p>
                        </button>
                      `;
                    })
                    .join('')}
                </div>
              </div>
            </main>
          `;

          document.getElementById('back-btn').addEventListener('click', handleBack);
          root.querySelectorAll('.option-card').forEach((btn) => {
            btn.addEventListener('click', () => handleSelectOption(btn.dataset.option));
          });
          return;
        }

        const evaluation = evaluateAnswers();
        const profile = ROLE_RESULTS[evaluation.topRole];
        const t = profile.theme;

        root.style.backgroundColor = t.pageBg;
        root.style.setProperty('--role-hero-bg', t.heroBg);
        root.style.setProperty('--role-border', t.border);
        root.style.setProperty('--role-divider', t.divider);
        root.style.setProperty('--role-accent', t.accent);
        root.style.setProperty('--role-accent-hover', t.accentHover);
        root.style.setProperty('--role-accent-text', t.accentText);
        root.style.setProperty('--role-soft-btn', t.softBtn);
        root.style.setProperty('--role-soft-btn-hover', t.softBtnHover);
        root.style.setProperty('--role-bar-track', t.barTrack);
        root.style.setProperty('--role-bar-muted', t.barMuted);

        root.innerHTML = `
          <header class="top-header" style="background-color: ${t.pageBg}; border-bottom-color: ${t.border};">
            <div class="header-inner">
              <button type="button" class="brand-btn" id="brand-btn">나에게 맞는 직무 유형 테스트</button>
              <button type="button" class="header-action-btn" id="header-restart-btn" style="color: ${t.accentText};">다시하기</button>
            </div>
          </header>
          <main class="main-stage">
            <div class="result-grid">
              <section class="result-hero-card">
                <div>
                  <p class="result-kicker">나의 추천 직무 유형</p>
                  <h1 class="result-title">${profile.title}</h1>
                  <p class="result-nickname">“${profile.nickname}”</p>
                </div>
                <div class="illustration-box square">
                  ${getSvgIllustration(evaluation.topRole)}
                </div>
                <p class="result-desc">${profile.description}</p>
              </section>

              <section class="result-detail-card">
                <div>
                  <h2 class="section-heading">지금부터 준비하면 좋은 자격증 · 과목 3가지</h2>
                  <p class="section-sub">대학생 시기에 부담 없이 시작해 진로 방향을 다질 수 있는 추천 목록이에요.</p>
                  <ul class="prep-list">
                    ${profile.prepItems
                      .map(
                        (item, idx) => `
                        <li class="prep-item">
                          <span class="prep-meta">0${idx + 1} · ${item.category}</span>
                          <p class="prep-title">${item.title}</p>
                          <p class="prep-detail">${item.detail}</p>
                        </li>
                      `
                      )
                      .join('')}
                  </ul>
                </div>

                <div>
                  <h2 class="chart-title">12개 답변으로 본 내 일하는 스타일 분포</h2>
                  <div class="chart-rows">
                    ${ROLE_ORDER.map((role) => {
                      const score = evaluation.scores[role];
                      const isWinner = role === evaluation.topRole;
                      const ratio = Math.max(score / 6, 0.04);
                      return `
                        <div class="chart-row">
                          <span class="chart-label ${isWinner ? 'winner' : ''}">${ROLE_SHORT_LABELS[role]}</span>
                          <div class="chart-track">
                            <div class="chart-fill ${isWinner ? 'winner' : ''}" style="transform: scaleX(${ratio});"></div>
                          </div>
                          <span class="chart-score ${isWinner ? 'winner' : ''}">${score}/6</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>

                <div>
                  <div class="action-row">
                    <button type="button" class="share-btn" id="share-btn">
                      ${state.copied ? '✓ 복사 완료!' : '공유하기'}
                    </button>
                    <button type="button" class="primary-btn result-primary-btn" id="restart-btn">
                      다시하기
                    </button>
                  </div>
                  <p class="copy-feedback" aria-live="polite">
                    ${state.copied ? '결과 텍스트가 클립보드에 복사되었어요. 원하는 곳에 붙여넣어 공유해보세요.' : ''}
                  </p>
                </div>
              </section>
            </div>
          </main>
        `;

        document.getElementById('brand-btn').addEventListener('click', resetToStart);
        document.getElementById('header-restart-btn').addEventListener('click', resetToStart);
        document.getElementById('share-btn').addEventListener('click', handleShare);
        document.getElementById('restart-btn').addEventListener('click', resetToStart);
      }

      render();
    </script>
  </body>
</html>
